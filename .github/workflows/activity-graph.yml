name: activity graph

# Regenerates the contribution heatmap from GitHub's public contribution
# calendar (no secrets, no third-party chart service) and publishes it to the
# `activity` branch, which is what the profile README embeds.
#
# `main` requires a pull request plus the `sanity` check, so the generated asset
# is published to its own unprotected branch instead of being committed here.

on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - scripts/contrib_heatmap.py
      - .github/workflows/activity-graph.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch published local counts
        run: |
          set -euo pipefail
          # Local activity (Codex turns, local commits) is collected on the Mac
          # and parked on this branch, so a weekly run keeps it instead of
          # dropping back to GitHub-only data.
          if git fetch -q --depth=1 origin activity 2>/dev/null &&
             git show FETCH_HEAD:local-activity.json > "$RUNNER_TEMP/local-activity.json" 2>/dev/null; then
            echo "using published local counts"
          else
            echo "no local counts published yet; rendering GitHub only"
            rm -f "$RUNNER_TEMP/local-activity.json"
          fi
      - name: Render heatmap
        run: |
          python3 scripts/contrib_heatmap.py \
            --user "$GITHUB_REPOSITORY_OWNER" \
            --local-json "$RUNNER_TEMP/local-activity.json" \
            --out "$RUNNER_TEMP/activity.svg"
      - name: Publish to the activity branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan activity
          # `git switch --orphan` may or may not leave the index populated
          # depending on the git version, so clear it without failing when empty.
          git rm -rq --cached --ignore-unmatch .
          cp "$RUNNER_TEMP/activity.svg" activity.svg
          git add -- activity.svg
          if [ -f "$RUNNER_TEMP/local-activity.json" ]; then
            cp "$RUNNER_TEMP/local-activity.json" local-activity.json
            git add -- local-activity.json
          fi
          git commit -q -m "chore(activity): refresh contribution graph"
          git push -q --force origin activity
